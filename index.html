<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <title>Недельный планировщик</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell" id="app-root" aria-live="polite"></main>
    <input id="import-file-input" type="file" accept="application/json,.json" aria-label="Выбрать резервную копию" hidden />

    <dialog class="modal" id="task-dialog" aria-labelledby="task-dialog-title">
      <form class="task-form" id="task-form" novalidate>
        <div class="modal-header">
          <div>
            <p class="eyebrow">Задача</p>
            <h2 id="task-dialog-title">Новая задача</h2>
          </div>
          <button class="icon-button" type="button" data-close-task aria-label="Закрыть">×</button>
        </div>

        <p class="form-error" id="task-form-error" role="alert"></p>

        <label class="form-field field-wide">
          <span>Название <b aria-hidden="true">*</b></span>
          <input id="task-title" name="title" type="text" maxlength="120" required autocomplete="off" />
        </label>

        <div class="form-grid">
          <label class="form-field">
            <span>Блок <b aria-hidden="true">*</b></span>
            <select id="task-type" name="type">
              <option value="current">Текущая задача</option>
              <option value="strategic">Стратегическая задача</option>
            </select>
          </label>

          <label class="form-field">
            <span>Приоритет <b aria-hidden="true">*</b></span>
            <select id="task-priority" name="priority">
              <option value="high">Высокий</option>
              <option value="medium" selected>Средний</option>
              <option value="low">Низкий</option>
            </select>
          </label>

          <label class="form-field">
            <span>Дата <b aria-hidden="true">*</b></span>
            <input id="task-date" name="date" type="date" required />
          </label>

          <label class="form-field">
            <span>Время начала <b aria-hidden="true">*</b></span>
            <input id="task-start-time" name="startTime" type="time" required />
          </label>

          <label class="form-field">
            <span>Длительность, мин.</span>
            <input id="task-duration" name="durationMinutes" type="number" min="5" max="720" step="5" inputmode="numeric" />
          </label>
        </div>

        <label class="form-field field-wide">
          <span>Описание</span>
          <textarea id="task-description" name="description" rows="4" maxlength="2000"></textarea>
        </label>

        <label class="form-field field-wide">
          <span>Ссылка на документ</span>
          <input id="task-document-url" name="documentUrl" type="url" inputmode="url" placeholder="https://example.com" />
        </label>

        <fieldset class="recurrence-fieldset">
          <legend>Повторение</legend>
          <label class="repeat-switch">
            <input id="task-repeat" name="repeat" type="checkbox" />
            <span>Повторять задачу</span>
          </label>
          <div class="recurrence-options" id="recurrence-options" hidden>
            <span class="recurrence-label">Дни недели <b aria-hidden="true">*</b></span>
            <div class="weekday-options" role="group" aria-label="Дни повторения">
              <label><input type="checkbox" name="repeatWeekday" value="1" /> Пн</label>
              <label><input type="checkbox" name="repeatWeekday" value="2" /> Вт</label>
              <label><input type="checkbox" name="repeatWeekday" value="3" /> Ср</label>
              <label><input type="checkbox" name="repeatWeekday" value="4" /> Чт</label>
              <label><input type="checkbox" name="repeatWeekday" value="5" /> Пт</label>
              <label><input type="checkbox" name="repeatWeekday" value="6" /> Сб</label>
            </div>
            <label class="form-field field-wide recurrence-end-field">
              <span>Повторять до <b aria-hidden="true">*</b></span>
              <input id="task-repeat-end-date" name="repeatEndDate" type="date" />
            </label>
          </div>
          <p class="recurrence-note" id="recurrence-edit-note" hidden>
            Это экземпляр повторяющейся задачи. Его поля можно изменить независимо; для другого расписания создайте новую серию.
          </p>
        </fieldset>

        <div class="modal-actions">
          <button class="button button-secondary" type="button" data-close-task>Отмена</button>
          <button class="button button-primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal modal-small" id="transfer-dialog" aria-labelledby="transfer-dialog-title">
      <form class="task-form" id="transfer-form" novalidate>
        <div class="modal-header">
          <div>
            <p class="eyebrow">Перенос</p>
            <h2 id="transfer-dialog-title">Перенести задачу</h2>
          </div>
          <button class="icon-button" type="button" data-close-transfer aria-label="Закрыть">×</button>
        </div>
        <p class="transfer-task-name" id="transfer-task-name"></p>
        <p class="form-error" id="transfer-form-error" role="alert"></p>
        <label class="form-field field-wide">
          <span>Новая дата <b aria-hidden="true">*</b></span>
          <input id="transfer-date" type="date" required />
        </label>
        <div class="modal-actions">
          <button class="button button-secondary" type="button" data-close-transfer>Отмена</button>
          <button class="button button-primary" type="submit">Перенести</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal modal-small confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-dialog-title">
      <div>
        <h2 id="confirm-dialog-title">Подтвердите действие</h2>
        <p id="confirm-dialog-text"></p>
        <div class="modal-actions">
          <button class="button button-secondary" type="button" data-confirm-cancel>Отмена</button>
          <button class="button button-danger" type="button" data-confirm-accept>Подтвердить</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript-message">Для работы планировщика требуется JavaScript.</p>
    </noscript>
    <script src="script.js"></script>
  </body>
</html>
