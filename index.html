<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e8f0ee" />
  <title>Планы на неделю</title>
  <style>
    :root { --ink:#283548; --muted:#596579; --line:#d8dde3; --white:rgba(255,255,255,.82); --green:#5b9181; --green-dark:#477666; --pink:#eaa3ae; --yellow:#e9c868; --mint:#7fac9c; --blue:#93bce0; --lilac:#b7a3d4; --peach:#e9ad89; }
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100vh; margin:0; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 11% 18%,rgba(250,201,209,.93),transparent 28%),radial-gradient(circle at 77% 6%,rgba(183,216,232,.78),transparent 27%),radial-gradient(circle at 78% 100%,rgba(252,222,157,.65),transparent 31%),#e8f0ee; }
    button,input,select { font:inherit; } button { cursor:pointer; } .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .app { width:min(100% - 48px,1540px); margin:0 auto; padding:45px 0 48px; }
    .hero { display:flex; align-items:end; justify-content:space-between; gap:30px; padding-bottom:26px; }
    h1 { margin:0; font-size:clamp(2.7rem,5.8vw,5.2rem); line-height:.95; letter-spacing:-.058em; font-weight:750; }
    .intro { margin:13px 0 0; color:var(--muted); font-size:clamp(1rem,1.6vw,1.28rem); }
    .progress-card { display:grid; place-content:center; width:155px; min-height:102px; padding:15px; border:1px solid rgba(255,255,255,.7); border-radius:12px; background:var(--white); box-shadow:0 8px 22px rgba(46,67,82,.06); text-align:center; }
    .progress-number { font-size:1.75rem; line-height:1; font-weight:750; } .progress-label { margin-top:7px; color:var(--muted); font-size:.84rem; }
    .task-bar { display:grid; grid-template-columns:minmax(220px,1fr) 166px 139px auto; align-items:stretch; gap:12px; padding:13px; margin-bottom:27px; border:1px solid rgba(255,255,255,.74); border-radius:12px; background:var(--white); box-shadow:0 8px 24px rgba(46,67,82,.07); }
    .task-bar input,.task-bar select { width:100%; min-width:0; border:1px solid #c8cfd6; border-radius:10px; outline:none; color:var(--ink); background:rgba(255,255,255,.8); padding:0 18px; }
    .task-bar input,.task-bar select { height:57px; } .task-bar input::placeholder { color:#707681; } .task-bar input:focus,.task-bar select:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(91,145,129,.15); }
    .add-button { min-height:57px; border:0; border-radius:10px; color:#fff; background:var(--green); font-weight:700; font-size:1rem; box-shadow:0 3px 8px rgba(66,111,96,.2); } .add-button:hover { background:var(--green-dark); }
    .clear-button { align-self:center; border:0; padding:12px 7px; color:var(--muted); background:transparent; white-space:nowrap; font-size:.96rem; } .clear-button:hover { color:var(--ink); text-decoration:underline; text-underline-offset:4px; }
    .week-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:18px; }
    .day { display:flex; flex-direction:column; min-height:330px; overflow:hidden; border:1px solid rgba(255,255,255,.72); border-radius:11px; background:rgba(255,255,255,.78); box-shadow:0 8px 19px rgba(46,67,82,.07); }
    .day::before { display:block; height:9px; content:""; flex:none; background:var(--accent); } .day:nth-child(1){--accent:var(--pink)} .day:nth-child(2){--accent:var(--yellow)} .day:nth-child(3){--accent:var(--mint)} .day:nth-child(4){--accent:var(--blue)} .day:nth-child(5){--accent:var(--lilac)} .day:nth-child(6){--accent:var(--peach)} .day:nth-child(7){--accent:var(--mint)}
    .day.is-today { box-shadow:0 0 0 2px rgba(72,118,102,.36),0 10px 21px rgba(46,67,82,.08); }
    .day-head { padding:17px 17px 12px; border-bottom:1px solid var(--line); } .day-head-line { display:flex; align-items:center; justify-content:space-between; gap:8px; } .day-name { font-size:1.1rem; font-weight:750; letter-spacing:-.025em; } .today { padding:3px 7px; border-radius:20px; color:#447666; background:#dfeee8; font-size:.7rem; font-weight:700; } .day-count { margin:5px 0 0; color:var(--muted); font-size:.85rem; }
    .tasks { display:grid; gap:10px; align-content:start; padding:16px 14px; } .task { display:grid; grid-template-columns:22px minmax(0,1fr) 19px; align-items:start; gap:9px; padding:14px 12px; border:1px solid #dce0e5; border-radius:10px; background:rgba(255,255,255,.64); }
    .task input { appearance:none; width:20px; height:20px; margin:1px 0 0; border:1.5px solid #7c8591; border-radius:3px; background:#fff; } .task input:checked { border-color:var(--green); background:var(--green); } .task input:checked::after { display:block; width:5px; height:10px; margin:2px 0 0 6px; border:solid #fff; border-width:0 2px 2px 0; content:""; transform:rotate(45deg); }
    .task-text { overflow-wrap:anywhere; font-size:.99rem; line-height:1.35; } .task.done .task-text { color:#657080; text-decoration:line-through; } .delete-task { width:19px; height:21px; padding:0; border:0; color:#687486; background:transparent; font-size:1.32rem; line-height:1; } .delete-task:hover { color:#364355; }
    .empty { margin:26px 0; color:var(--muted); text-align:center; font-size:.96rem; } .day-add { margin:auto 14px 13px; padding:8px 0; border:0; color:var(--muted); background:transparent; text-align:left; font-size:.86rem; } .day-add:hover { color:var(--green-dark); }
    @media (max-width:1120px) { .week-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
    @media (max-width:820px) { .app { width:min(100% - 28px,700px); padding-top:28px; } .hero { align-items:start; } .task-bar { grid-template-columns:1fr 145px 125px; } .clear-button { grid-column:1 / -1; justify-self:end; padding:0 6px 4px; } .week-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; } }
    @media (max-width:540px) { .hero { display:block; } .progress-card { width:100%; min-height:76px; margin-top:20px; } .task-bar { grid-template-columns:1fr; } .task-bar input,.task-bar select { height:52px; } .clear-button { justify-self:start; } .week-grid { grid-template-columns:1fr; } .day { min-height:240px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero"><div><h1>Планы на неделю</h1><p class="intro">Добавляй задачи, отмечай выполненные и держи неделю в порядке.</p></div><section class="progress-card" aria-label="Прогресс недели"><strong class="progress-number" id="progress-number">0%</strong><span class="progress-label" id="progress-label">0 из 0 выполнено</span></section></header>
    <form class="task-bar" id="task-form"><label class="sr-only" for="task-input">Новая задача</label><input id="task-input" type="text" maxlength="120" placeholder="Новая задача" autocomplete="off" required /><label class="sr-only" for="day-select">День недели</label><select id="day-select"></select><button class="add-button" type="submit">Добавить</button><button class="clear-button" id="clear-completed" type="button">Убрать выполненные</button></form>
    <section class="week-grid" id="week" aria-label="Задачи на неделю"></section>
  </main>
  <script>
    const days=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
    const storageKey='soft-weekly-todo-v1'; const taskForm=document.getElementById('task-form'); const taskInput=document.getElementById('task-input'); const daySelect=document.getElementById('day-select'); const week=document.getElementById('week'); const progressNumber=document.getElementById('progress-number'); const progressLabel=document.getElementById('progress-label'); const currentDay=new Date().getDay(); const todayIndex=currentDay===0?6:currentDay-1; let tasks=loadTasks();
    days.forEach((day,index)=>daySelect.add(new Option(day,index))); daySelect.value=todayIndex;
    function loadTasks(){try{return JSON.parse(localStorage.getItem(storageKey))||[]}catch{return[]}} function saveTasks(){localStorage.setItem(storageKey,JSON.stringify(tasks))} function escapeHtml(value){return value.replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
    function render(){week.innerHTML=days.map((day,dayIndex)=>{const dayTasks=tasks.filter(task=>task.day===dayIndex);const completed=dayTasks.filter(task=>task.done).length;const taskMarkup=dayTasks.length?dayTasks.map(task=>`<div class="task ${task.done?'done':''}"><input type="checkbox" ${task.done?'checked':''} aria-label="Отметить задачу: ${escapeHtml(task.text)}" data-check="${task.id}"><span class="task-text">${escapeHtml(task.text)}</span><button class="delete-task" type="button" aria-label="Удалить задачу" data-delete="${task.id}">×</button></div>`).join(''):'<p class="empty">Пока свободно</p>';return `<article class="day ${dayIndex===todayIndex?'is-today':''}"><header class="day-head"><div class="day-head-line"><span class="day-name">${day}</span>${dayIndex===todayIndex?'<span class="today">сегодня</span>':''}</div><p class="day-count">${completed} из ${dayTasks.length} выполнено</p></header><div class="tasks">${taskMarkup}</div><button class="day-add" type="button" data-add-day="${dayIndex}">+ Добавить задачу</button></article>`}).join('');const completed=tasks.filter(task=>task.done).length;const percent=tasks.length?Math.round(completed/tasks.length*100):0;progressNumber.textContent=`${percent}%`;progressLabel.textContent=`${completed} из ${tasks.length} выполнено`;saveTasks()}
    taskForm.addEventListener('submit',event=>{event.preventDefault();const text=taskInput.value.trim();if(!text)return;tasks.push({id:Date.now(),text,day:Number(daySelect.value),done:false});taskInput.value='';render();taskInput.focus()});
    week.addEventListener('change',event=>{const id=Number(event.target.dataset.check);const task=tasks.find(item=>item.id===id);if(task){task.done=event.target.checked;render()}});
    week.addEventListener('click',event=>{const deleteId=Number(event.target.dataset.delete);const addDay=event.target.dataset.addDay;if(deleteId){tasks=tasks.filter(task=>task.id!==deleteId);render()}if(addDay!==undefined){daySelect.value=addDay;taskInput.focus()}});
    document.getElementById('clear-completed').addEventListener('click',()=>{tasks=tasks.filter(task=>!task.done);render()});render();
  </script>
</body>
</html>
